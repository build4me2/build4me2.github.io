name: Validate and deploy Hugo site to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Pull-request jobs inherit read-only repository access. Pages and OIDC
# permissions are granted only to approved-event jobs below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: '0.162.0'

jobs:
  validate-build:
    name: Validate and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '${{ env.HUGO_VERSION }}'
          extended: true

      - name: Run complete validation suite
        run: make validate

      - name: Verify reproducible clean build
        run: make reproducible

      - name: Build validated deployment output
        run: make build

      - name: Preserve validated site for approved deployment
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: ./public
          if-no-files-found: error
          include-hidden-files: true

  package-pages:
    name: Package validated Pages artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: ./public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy validated site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
